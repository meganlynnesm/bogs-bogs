<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bogs — bogs</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="landing.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
</head>
<body class="landing-page">

  <!-- Whole landing is one click through to the menu -->
  <a class="landing" href="menu.html" aria-label="Enter — open the menu">
    <img class="landing-bg" src="landing-bg.png" alt="" />
    <div class="veil"></div>
    <div class="texture"></div>

    <div class="content">
      <div class="row top">
        <span class="mono brand">bogs&#8202;<span class="accent">—</span>&#8202;bogs</span>
        <span class="mono">Summer 2026</span>
      </div>

      <div class="landing-hero">
        <h1 class="landing-title">
          <span>Data</span>
          <span>Peat</span>
          <span class="pixel">Future</span>
          <span>Obsolete</span>
        </h1>
      </div>

      <div class="row bottom">
        <span class="mono">Columbia GSAPP &nbsp;—&nbsp; Computational Design Practices</span>
        <span class="mono enter">Enter&nbsp;&#10142;</span>
      </div>
    </div>

    <!-- pink/orange duotone filter for the background render -->
    <svg class="duo-def" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="duotone" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix"
          values="0.33 0.33 0.33 0 0
                  0.33 0.33 0.33 0 0
                  0.33 0.33 0.33 0 0
                  0    0    0    1 0" />
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.00 0.23 0.55 0.87 0.99 0.99" />
          <feFuncG type="table" tableValues="0.00 0.06 0.16 0.29 0.62 0.99" />
          <feFuncB type="table" tableValues="0.02 0.44 0.51 0.41 0.43 0.75" />
        </feComponentTransfer>
      </filter>
    </svg>
  </a>

</body>
</html>
